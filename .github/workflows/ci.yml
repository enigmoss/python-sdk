name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # Only pytest: the README framework recipes are skipped where their frameworks are absent
      # and run on 3.13, where the readme group is installed.
      - run: uv sync --locked --no-default-groups --group test ${{ matrix.python == '3.13' && '--group readme --group lint' || '' }}
      - run: uv run --no-sync pytest

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: sh scripts/check-package.sh
