name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # Only pytest: the README framework recipes are skipped where their frameworks are absent
      # and run on 3.13, where the readme group is installed.
      - run: uv sync --locked --no-default-groups --group test ${{ matrix.python == '3.13' && '--group readme --group lint' || '' }}
      - run: uv run pytest

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv build
      - name: Install the wheel into an empty venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import enigmoss, importlib.metadata as m; print(enigmoss.__version__); assert not m.requires('enigmoss')"
          test "$(/tmp/clean/bin/pip list --format=freeze | grep -v -i -E '^(enigmoss|pip|setuptools)==' | wc -l)" -eq 0
