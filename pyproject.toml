[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "enigmoss"
dynamic = ["version"]
description = "Official Python client of the Enigmoss Project API v4: payments, wallets, payouts, refunds, transfers and signed webhooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["enigmoss", "payments", "payouts", "crypto", "webhooks", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff>=0.8", "mypy>=1.13"]
# The README recipes are executed against these frameworks; the tests skip a recipe whose
# framework is not installed.
readme = ["fastapi>=0.115", "httpx>=0.27", "flask>=3.0", "django>=5.0", "django-stubs>=5.0"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "readme" },
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
path = "src/enigmoss/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/enigmoss", "tests", "llms.txt", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/enigmoss"]

[tool.hatch.build.targets.wheel.force-include]
"llms.txt" = "enigmoss/llms.txt"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S", "D"]
ignore = [
    "D105",    # magic methods are self-explanatory
    "D107",    # __init__ is documented on the class
    "PLR0913", # keyword-only API methods mirror the wire fields
    "PLR2004", # HTTP status codes are readable as they are
    "PLR0911",
    "PLR0912",
    "S311",    # random is used for retry jitter only
    "PLR0917", # internal helpers take the filters positionally
    "D301",    # docstrings show "\\n" of signed strings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "PLR", "PLC0415", "N802", "N815", "RUF001"]
"scripts/**" = ["D", "S"]
"src/enigmoss/_*.py" = ["D101", "D102", "D103"]
"src/enigmoss/models/_*.py" = ["D101", "D102", "D103"]
"src/enigmoss/resources/_*.py" = ["D101", "D102", "D103"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]
